<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Snippet — Plain</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/icons/plain-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/docs/assets/style.css" />
    <style>
      .editor-wrap {
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: border-color var(--transition);
      }
      .editor-wrap:focus-within {
        border-color: rgba(192, 133, 50, 0.4);
        box-shadow: 0 0 0 3px rgba(192, 133, 50, 0.08);
      }
      .editor-titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-3);
      }
      .dot-r {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #f87171;
      }
      .dot-y {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fbbf24;
      }
      .dot-g {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #4ade80;
      }
      .editor-filename {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-3);
        margin-left: 6px;
      }
      textarea {
        width: 100%;
        min-height: 320px;
        background: transparent;
        border: none;
        outline: none;
        padding: 20px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.8;
        color: var(--text);
        resize: vertical;
      }
      textarea::placeholder {
        color: var(--text-3);
      }
      .editor-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        background: var(--bg-3);
      }
      .char-count {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-3);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .save-btn {
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: none;
        padding: 9px 22px;
        border-radius: 10px;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .save-btn:hover:not(:disabled) {
        background: var(--accent-2);
        transform: translateY(-1px);
        box-shadow: 0 8px 24px var(--accent-glow);
      }
      .save-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }
      .save-btn .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .raw-btn {
        font-size: 12px;
        font-family: var(--mono);
        color: var(--text-2);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: all var(--transition);
      }
      .raw-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }

      /* Link panel */
      .link-panel {
        margin-top: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .link-panel-section {
        padding: 16px 20px;
      }
      .link-panel-section + .link-panel-section {
        border-top: 1px solid var(--border);
      }
      .lp-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 2px;
      }
      .lp-sublabel {
        font-size: 10px;
        font-family: var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-3);
        margin-bottom: 10px;
      }
      .lp-url {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--accent-2);
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 10px;
      }
      .lp-actions {
        display: flex;
        gap: 8px;
      }
      .lp-btn {
        font-size: 11px;
        font-family: var(--mono);
        color: var(--text-2);
        background: var(--bg-2);
        border: 1px solid var(--border);
        padding: 5px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: all var(--transition);
        text-decoration: none;
        display: inline-block;
      }
      .lp-btn:hover {
        color: var(--text);
        border-color: var(--border-hover);
      }

      /* Danger zone */
      .danger-zone {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .danger-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--red);
        margin-bottom: 4px;
      }
      .danger-desc {
        font-size: 12px;
        color: var(--text-3);
      }
      .delete-btn {
        font-size: 12px;
        font-family: var(--mono);
        color: var(--red);
        background: transparent;
        border: 1px solid rgba(248, 113, 113, 0.3);
        padding: 7px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all var(--transition);
        white-space: nowrap;
      }
      .delete-btn:hover {
        background: rgba(248, 113, 113, 0.08);
        border-color: var(--red);
      }
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--bg-3);
        border: 1px solid rgba(74, 222, 128, 0.3);
        color: #4ade80;
        font-family: var(--mono);
        font-size: 12px;
        padding: 10px 18px;
        border-radius: 10px;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.25s;
        pointer-events: none;
        z-index: 999;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .loading-state {
        text-align: center;
        padding: 60px 0;
        color: var(--text-3);
        font-family: var(--mono);
        font-size: 13px;
      }
      .error-state {
        text-align: center;
        padding: 60px 0;
        color: var(--red);
        font-family: var(--mono);
        font-size: 13px;
      }
      .meta {
        font-size: 12px;
        color: var(--text-3);
        font-family: var(--mono);
      }
    </style>
    <style>
      html {
        scroll-padding-top: 72px;
      }
    </style>
    <script>
      history.scrollRestoration = "manual";
    </script>
  </head>
  <body>

    <div class="container" style="max-width: 720px">
      <div id="loading" class="loading-state">Loading snippet…</div>
      <div id="app" style="display: none">
        <div class="hero-eyebrow">Edit Snippet</div>
        <h1><span id="snippet-id"></span></h1>
        <p class="hero-sub" id="meta"></p>

        <div class="editor-wrap">
          <div class="editor-titlebar">
            <div class="dot-r"></div>
            <div class="dot-y"></div>
            <div class="dot-g"></div>
            <span class="editor-filename" id="filename">snippet.txt</span>
          </div>
          <textarea id="text" placeholder="Type your text here…"></textarea>
          <div class="editor-footer">
            <span class="char-count" id="count">0 chars</span>
            <div class="actions">
              <a class="raw-btn" id="raw-link" target="_blank">View Raw ↗</a>
              <button class="save-btn" id="save-btn" onclick="save()">
                Save Changes
              </button>
            </div>
          </div>
        </div>

        <!-- Link panel -->
        <div class="link-panel">
          <div class="link-panel-section">
            <div class="lp-label">Edit Link</div>
            <div class="lp-sublabel">Private</div>
            <div class="lp-url" id="lp-edit-url"></div>
            <div class="lp-actions">
              <button class="lp-btn" onclick="lpCopy('lp-edit-url', this)">
                Copy
              </button>
              <a class="lp-btn" id="lp-edit-open" href="#"
                >Bookmark this page ↗</a
              >
            </div>
          </div>
          <div class="link-panel-section">
            <div class="lp-label">Raw Link</div>
            <div class="lp-sublabel">Public</div>
            <div class="lp-url" id="lp-raw-url"></div>
            <div class="lp-actions">
              <button class="lp-btn" onclick="lpCopy('lp-raw-url', this)">
                Copy
              </button>
              <a class="lp-btn" id="lp-raw-open" href="#" target="_blank"
                >Open raw text ↗</a
              >
            </div>
          </div>
        </div>

        <!-- Danger zone -->
        <div class="danger-zone">
          <div>
            <div class="danger-label">Danger Zone</div>
            <div class="danger-desc">
              Permanently delete this snippet. This cannot be undone.
            </div>
          </div>
          <button class="delete-btn" onclick="deleteSnippet()">
            Delete Snippet
          </button>
        </div>
      </div>
      <div id="error" class="error-state" style="display: none"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // Parse /plain/edit/:id/:editKey from URL
      const parts = location.pathname.split("/").filter(Boolean);
      // parts: ['plain','edit',id,editKey]
      const id = parts[2];
      const editKey = parts[3];

      if (!id || !editKey) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = "Invalid edit URL.";
      } else {
        fetch(`/plain/api/snippet/${id}/${editKey}`)
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("loading").style.display = "none";
            if (!data.ok) {
              document.getElementById("error").style.display = "block";
              document.getElementById("error").textContent =
                data.error || "Not found.";
              return;
            }
            document.getElementById("app").style.display = "block";
            document.getElementById("snippet-id").textContent = id;
            document.getElementById("filename").textContent = `${id}.txt`;
            const rawUrl = `${location.origin}/plain/raw/${id}`;
            const editUrl = location.href;
            document.getElementById("raw-link").href = rawUrl;
            document.getElementById("lp-edit-url").textContent = editUrl;
            document.getElementById("lp-raw-url").textContent = rawUrl;
            document.getElementById("lp-edit-open").href = editUrl;
            document.getElementById("lp-raw-open").href = rawUrl;
            document.getElementById("text").value = data.text;
            updateCount();
            if (data.createdAt) {
              document.getElementById("meta").textContent =
                `Created ${new Date(data.createdAt).toLocaleString()}`;
            }
          })
          .catch(() => {
            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "block";
            document.getElementById("error").textContent =
              "Failed to load snippet.";
          });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const ta = document.getElementById("text");
        if (ta) {
          ta.addEventListener("input", updateCount);
          ta.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && e.ctrlKey) save();
          });
        }
      });

      function updateCount() {
        const n = document.getElementById("text").value.length;
        document.getElementById("count").textContent =
          `${n.toLocaleString()} chars`;
      }

      async function save() {
        const btn = document.getElementById("save-btn");
        const text = document.getElementById("text").value;
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Saving…';
        try {
          const res = await fetch(`/plain/api/edit/${id}/${editKey}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error);
          toast("Saved ✓");
        } catch (e) {
          toast("Error: " + e.message, true);
        }
        btn.disabled = false;
        btn.textContent = "Save Changes";
      }

      function toast(msg, err = false) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.style.borderColor = err
          ? "rgba(248,113,113,0.3)"
          : "rgba(74,222,128,0.3)";
        t.style.color = err ? "#f87171" : "#4ade80";
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      function lpCopy(elId, btn) {
        navigator.clipboard
          .writeText(document.getElementById(elId).textContent)
          .then(() => {
            btn.textContent = "Copied!";
            setTimeout(() => (btn.textContent = "Copy"), 1500);
          });
      }

      async function deleteSnippet() {
        if (!confirm("Delete this snippet permanently?")) return;
        try {
          const res = await fetch(`/plain/api/delete/${id}/${editKey}`, {
            method: "DELETE",
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error);
          window.location.href = "/plain";
        } catch (e) {
          toast("Error: " + e.message, true);
        }
      }
    </script>
  </body>
</html>
